<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>T3 原图逐项核对</title><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Microsoft YaHei',sans-serif;background:#111a1b;color:#e9eded}header{padding:18px 24px;border-bottom:1px solid #425151}h1{margin:0 0 8px;font-size:23px}p{margin:6px 0;line-height:1.7;color:#b8cbca}a{color:#9ee7d6}main{display:grid;grid-template-columns:minmax(0,1fr) 355px;height:calc(100vh - 156px)}.drawing{overflow:auto;background:#000}svg{width:100%;min-width:1000px;height:auto}aside{overflow:auto;padding:14px;background:#1e2b2c}button,select{background:#304a4b;color:#fff;border:1px solid #628380;padding:8px;cursor:pointer;border-radius:4px}.row{padding:10px;border-bottom:1px solid #425454;cursor:pointer}.row:hover{background:#304a4b}.id{color:#ffe297}.small{font-size:11px;color:#a8bdbc;line-height:1.7}.selected{background:#354f50}.tag{font-size:11px;background:#354b48;padding:2px 5px}#detail{position:fixed;bottom:10px;left:14px;background:#183b39ed;padding:10px 16px;max-width:65%;border:1px solid #82bbac}svg text{paint-order:stroke;stroke:#071818;stroke-width:4px;font-size:13px;font-weight:bold;pointer-events:none}label{margin-right:16px}#crop{width:100%;height:220px;background-repeat:no-repeat;border:1px solid #667e77;margin-top:12px}</style>
<header><h1>先对原图，再看模型 · 第 5 版设施核对</h1><p>保留 A–G 值机岛；本轮修改垂直交通、上层前厅、国内安检及国际边检—安检关系。编号圆圈定位的是图标，模型使用的落点另有记录。</p><label><input id="all" type="checkbox">全部设施图标</label><label><input id="routes" type="checkbox">叠加动线描线（尚待校验）</label><button id="reset">全图</button> <button id="upper">上层放大</button> <button id="lower">值机层放大</button> <a href="index.html?view=upperplan" target="_blank">打开 3D 对照</a> · <a href="CHANGES.md">修改与未完成项</a></header>
<main><div class="drawing"><svg id="diagram" viewBox="0 0 2250 1780"><image href="../revision4/user-layout-reference.jpg" width="2250" height="1780"/><g id="lines"></g><g id="points"></g></svg></div><aside><strong id="count"></strong><div id="crop"></div><p class="small">点击编号放大原图。橙色为本轮重点；灰色为尚未逐项落模的其他设施。不能用图标清单数量代替模型完成度。</p><div id="list"></div></aside></main><div id="detail">请选择设施查看原图图标与核对状态。</div>
<script>
const ns='http://www.w3.org/2000/svg';let data;
function el(n,a,parent){let e=document.createElementNS(ns,n);for(let[k,v]of Object.entries(a))e.setAttribute(k,v);parent.append(e);return e;}
const focus=new Set(['lift','accessible_lift','escalator','down_escalator','arrivals_escalator','security','immigration','customs','quarantine','arrivals','unresolved']);
function choose(f){document.querySelector('#crop').style.backgroundImage='url(../revision4/user-layout-reference.jpg)';document.querySelector('#crop').style.backgroundPosition=`${155-f.pixel[0]}px ${110-f.pixel[1]}px`;document.querySelector('#detail').textContent=f.id+' · '+f.label+' · '+f.status+' · 原图像素 '+f.pixel.join(', ');}
function render(){points.replaceChildren();list.replaceChildren();let fs=data.facilities.filter(f=>all.checked||focus.has(f.kind));count.textContent=`显示 ${fs.length} / ${data.facilities.length} 个图标记录`;
for(let f of fs){let[x,y]=f.pixel;let g=el('g',{},points);el('circle',{cx:x,cy:y,r:13,fill:'none',stroke:focus.has(f.kind)?'#ffd36b':'#b3c6c6','stroke-width':3},g);let t=el('text',{x:x+17,y:y-9,fill:'#fff'},g);t.textContent=f.id;g.style.cursor='pointer';g.onclick=()=>choose(f);let r=document.createElement('div');r.className='row';r.innerHTML=`<span class="id">${f.id}</span> ${f.label}<br><span class="small">${f.status}</span>`;r.onclick=()=>choose(f);list.append(r);}
lines.replaceChildren();if(routes.checked)for(let r of data.routes)el('polyline',{points:r.points.map(p=>p.join(',')).join(' '),fill:'none',stroke:r.color,'stroke-width':4,'stroke-dasharray':'8 6',opacity:.9},lines);}
fetch('diagram-trace.json').then(r=>r.json()).then(d=>{data=d;render()});all.onchange=routes.onchange=render;reset.onclick=()=>diagram.setAttribute('viewBox','0 0 2250 1780');upper.onclick=()=>diagram.setAttribute('viewBox','900 620 800 520');lower.onclick=()=>diagram.setAttribute('viewBox','940 1080 800 510');
</script></html>
