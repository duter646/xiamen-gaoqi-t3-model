name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/assets _site/vendor
          cp index.html app.js style.css _site/
          cp assets/routes.json _site/assets/
          cp vendor/*.js _site/vendor/
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "xiamen-gaoqi-t3.glb" --dir _site/assets
          touch _site/.nojekyll
          test -s _site/assets/xiamen-gaoqi-t3.glb

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
